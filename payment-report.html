<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ABA Payment Report</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#0c0c0e;color:#e8e8f0;min-height:100vh;padding:34px 5%;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
h1{font-weight:800;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.03em;line-height:1}
.sub{color:#85859a;margin-top:.65rem}
.panel{background:#17171d;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:1rem;margin-bottom:1rem}
label{display:block;font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.14em;color:#00d4a0;margin-bottom:.55rem}
textarea{width:100%;min-height:190px;background:#111115;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e8e8f0;font:14px/1.65 'Space Mono',monospace;padding:1rem;resize:vertical;outline:none}
textarea:focus{border-color:rgba(0,212,160,.45)}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.85rem}
button{font-family:'Space Mono',monospace;font-weight:700;font-size:.78rem;letter-spacing:.06em;border:none;border-radius:4px;padding:.8rem 1.15rem;cursor:pointer}
.primary{background:#00d4a0;color:#02030a}
.ghost{background:transparent;color:#85859a;border:1px solid rgba(255,255,255,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1rem}
.stat{background:#17171d;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:1rem}
.stat strong{display:block;font-size:1.8rem;line-height:1;color:#00d4a0}
.stat span{font-family:'Space Mono',monospace;font-size:.68rem;color:#85859a;letter-spacing:.08em}
.tablewrap{overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#17171d}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:.85rem;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}
th{font-family:'Space Mono',monospace;font-size:.65rem;letter-spacing:.1em;color:#00d4a0;background:#111115}
td{font-size:.9rem;color:#d7d7e0}
tr:last-child td{border-bottom:none}
.empty{color:#85859a;padding:1rem}
.report{white-space:pre-wrap;background:#111115;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:1rem;color:#d7d7e0;font-family:'Space Mono',monospace;font-size:.78rem}
@media(max-width:760px){body{padding:24px 4%}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>Payment Report</h1>
      <p class="sub">Paste ABA PayWay bot messages, then generate a clean report.</p>
    </div>
    <button class="ghost" onclick="window.print()">PRINT</button>
  </div>

  <section class="panel">
    <label for="raw">ABA BOT MESSAGES</label>
    <textarea id="raw" placeholder="$0.01 paid by RON VIREAK (*400) on May 27, 04:41 PM via ABA PAY at MAI BICH. Trx. ID: 177987486639961, APV: 888477."></textarea>
    <div class="actions">
      <button class="primary" onclick="buildReport()">GENERATE_REPORT()</button>
      <button class="ghost" onclick="copyReport()">COPY REPORT</button>
      <button class="ghost" onclick="clearAll()">CLEAR</button>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><strong id="totalTx">0</strong><span>TRANSACTIONS</span></div>
    <div class="stat"><strong id="totalUsd">$0.00</strong><span>TOTAL USD</span></div>
    <div class="stat"><strong id="reportDate">-</strong><span>REPORT DATE</span></div>
  </section>

  <section class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Time</th><th>Amount</th><th>Paid By</th><th>Method</th><th>Business</th><th>Transaction ID</th><th>APV</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">No report generated yet.</td></tr></tbody>
    </table>
  </section>

  <section class="panel">
    <label>CLEAN REPORT</label>
    <div class="report" id="clean">No report generated yet.</div>
  </section>
</main>

<script>
function parsePayments(text){
  var regex=/\$([0-9]+(?:\.[0-9]+)?)\s+paid by\s+(.+?)\s+on\s+(.+?),\s+(.+?)\s+via\s+(.+?)\s+at\s+(.+?)\.\s+Trx\. ID:\s+([0-9A-Za-z-]+),\s+APV:\s+([0-9A-Za-z-]+)/gi;
  var rows=[],match;
  while((match=regex.exec(text))!==null){
    rows.push({
      amount:parseFloat(match[1]),
      paidBy:match[2].trim(),
      date:match[3].trim(),
      time:match[4].trim(),
      method:match[5].trim(),
      business:match[6].trim(),
      trx:match[7].trim(),
      apv:match[8].trim()
    });
  }
  return rows;
}
function money(n){return '$'+Number(n||0).toFixed(2);}
function buildReport(){
  var rows=parsePayments(document.getElementById('raw').value);
  var body=document.getElementById('rows');
  var total=rows.reduce(function(sum,row){return sum+row.amount;},0);
  document.getElementById('totalTx').textContent=rows.length;
  document.getElementById('totalUsd').textContent=money(total);
  document.getElementById('reportDate').textContent=rows[0]?rows[0].date:'-';
  if(!rows.length){
    body.innerHTML='<tr><td colspan="8" class="empty">No ABA PayWay payment messages found.</td></tr>';
    document.getElementById('clean').textContent='No ABA PayWay payment messages found.';
    return;
  }
  body.innerHTML=rows.map(function(row){
    return '<tr><td>'+row.date+'</td><td>'+row.time+'</td><td>'+money(row.amount)+'</td><td>'+row.paidBy+'</td><td>'+row.method+'</td><td>'+row.business+'</td><td>'+row.trx+'</td><td>'+row.apv+'</td></tr>';
  }).join('');
  var report=[
    'DAILY PAYMENT REPORT',
    'Date: '+rows[0].date,
    '',
    'Total Transactions: '+rows.length,
    'Total USD: '+money(total),
    '',
    'Transactions:'
  ];
  rows.forEach(function(row,i){
    report.push((i+1)+'. '+row.time+' | '+money(row.amount)+' | '+row.paidBy+' | '+row.method+' | Trx: '+row.trx+' | APV: '+row.apv);
  });
  document.getElementById('clean').textContent=report.join('\n');
}
function copyReport(){
  var text=document.getElementById('clean').textContent;
  navigator.clipboard.writeText(text);
}
function clearAll(){
  document.getElementById('raw').value='';
  document.getElementById('rows').innerHTML='<tr><td colspan="8" class="empty">No report generated yet.</td></tr>';
  document.getElementById('clean').textContent='No report generated yet.';
  document.getElementById('totalTx').textContent='0';
  document.getElementById('totalUsd').textContent='$0.00';
  document.getElementById('reportDate').textContent='-';
}
</script>
</body>
</html>
